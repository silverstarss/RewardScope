model:
  name: Qwen/Qwen2.5-1.5B-Instruct

dataset:
  name: gsm8k
  split: test
  max_prompts: 16

sampling:
  num_samples: 8
  seed: 42
  temperature: 0.7
  top_p: 0.95
  max_new_tokens: 256

reward:
  correct_answer_reward: 1.0
  incorrect_answer_reward: 0.0
  format_compliance_reward: 0.0
  length_penalty_per_token: 0.0

output:
  run_id: gsm8k-qwen-smoke
  output_dir: outputs/gsm8k-qwen-smoke

analysis:
  strict: false
  k_values: [1, 4, 8]
