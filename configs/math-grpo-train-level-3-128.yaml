model:
  name: /home/tutu/tinyvr/models/Qwen/Qwen2___5-1___5B-Instruct
  prompt_format: chat

dataset:
  name: math
  config: all
  split: train
  revision: master
  max_examples: 128
  selection: random
  dataset_seed: 42
  levels: [Level 3]
  data_source: modelscope
  prompt_template: zero_shot_boxed

sampling:
  num_samples: 8
  generation_seed: 42
  temperature: 0.7
  top_p: 0.95
  max_new_tokens: 512
  batch_size: 4

verification:
  backend: math_verify_latex
  mode: training

reward:
  correct_answer_reward: 1.0
  incorrect_answer_reward: 0.0
  format_compliance_reward: 0.0
  length_penalty_per_token: 0.0

output:
  run_id: math-qwen-grpo-train-level-3-128
  output_dir: outputs/math-qwen-grpo-train-level-3-128
  keep_failed_run: false

analysis:
  strict: true
  k_values: [1, 4, 8]
  write_plots: true
