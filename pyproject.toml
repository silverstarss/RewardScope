[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rewardscope"
version = "0.0.0"
description = "Lightweight rollout diagnostics for RLVR experiments."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
